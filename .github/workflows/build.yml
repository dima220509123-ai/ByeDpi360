name: Build byedpi.xex

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PowerPC cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-powerpc-linux-gnu binutils-powerpc-linux-gnu python3

      - name: Build XEX
        run: bash build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: byedpi-xex
          path: build/byedpi.xex
          if-no-files-found: error

      - name: Commit built XEX
        run: |
          cp build/byedpi.xex byedpi.xex
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f byedpi.xex
          git commit -m "built byedpi.xex" || true
          git push
